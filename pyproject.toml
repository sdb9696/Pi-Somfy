[project]
name = "pi-somfy"
version = "0.1.0"
description = "Control Somfy shutters with Raspberry Pi"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE"}
dependencies = [
    "ephem",
    "configparser",
    "Flask",
    "paho-mqtt",
    "pigpio",
    "requests",
    "numpy",
    "click",
]

[dependency-groups]
dev = [
  "pytest"
]

[project.scripts]
pi-somfy = "pi_somfy.operateShutters:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_somfy"]
